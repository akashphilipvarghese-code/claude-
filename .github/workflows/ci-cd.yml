name: Tradeix Interface CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  IMAGE_NAME: tradeix-interface

jobs:
  remediate-dependencies:
    name: Remediate vulnerable npm dependencies
    # Only trusted branches from this repository may receive write credentials.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'security/require-production-session-secret'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - name: Apply non-breaking npm audit fixes
        run: |
          # npm audit fix returns 1 when unfixed advisories remain, even if it
          # successfully updates the lockfile. Verify changes before committing.
          npm audit fix --no-fund || echo "Some advisories require separate major-version upgrades; continuing with verification."
      - name: Verify updated dependencies and app
        run: |
          npm ci
          npm run lint
          npm test
          npm run build
      - name: Commit verified package updates
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "No compatible dependency changes were available."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "fix(deps): update vulnerable npm dependencies"
          git push origin HEAD:security/require-production-session-secret

  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npm run lint
      - run: npm test

  build:
    name: Build Next.js app
    needs: lint-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npm run build

  docker-build-scan:
    name: Build & scan container image
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t ${{ env.IMAGE_NAME }}:${{ github.sha }} .
      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "${{ env.IMAGE_NAME }}:${{ github.sha }}"
          severity: "CRITICAL,HIGH"
          exit-code: "1"

  deploy:
    name: Deploy to production
    needs: docker-build-scan
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      # Placeholder — wire to the real target (ECS/Kubernetes/Vercel) once
      # infrastructure from Phase 5 (Infrastructure & Cloud) exists.
      - name: Deploy
        run: echo "Deploy ${{ env.IMAGE_NAME }}:${{ github.sha }} to production — target infra not yet provisioned"
      - name: Post-deploy health check
        run: echo "Would curl https://<production-host>/api/health and roll back on non-200"
