name: Tradeix Interface CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  IMAGE_NAME: tradeix-interface

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - run: npm run lint
      # The project installs Vitest but not @vitest/coverage-v8.
      # Run the existing test suite without requesting an unavailable provider.
      - run: npm test

  build:
    name: Build Next.js app
    needs: lint-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - run: npm run build

  docker-build-scan:
    name: Build & scan container image
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t ${{ env.IMAGE_NAME }}:${{ github.sha }} .
      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "${{ env.IMAGE_NAME }}:${{ github.sha }}"
          severity: "CRITICAL,HIGH"
          exit-code: "1"

  deploy:
    name: Deploy to production
    needs: docker-build-scan
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      # Placeholder — wire to the real target (ECS/Kubernetes/Vercel) once
      # infrastructure from Phase 5 (Infrastructure & Cloud) exists.
      - name: Deploy
        run: echo "Deploy ${{ env.IMAGE_NAME }}:${{ github.sha }} to production — target infra not yet provisioned"
      - name: Post-deploy health check
        run: echo "Would curl https://<production-host>/api/health and roll back on non-200"
